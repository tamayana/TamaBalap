<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>TamaBalap - Pontianak Racing</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;touch-action:none}
body{background:#000;overflow:hidden;font-family:sans-serif}
#game{position:relative;width:100vw;height:100vh;background:url('pontianak-map.jpg') no-repeat center/cover}
canvas{position:absolute;top:0;left:0;width:100%;height:100%}
#hud{position:absolute;top:10px;left:10px;color:#fff;background:rgba(0,0,0,.7);padding:8px 12px;border-radius:10px;font-size:13px;z-index:10;line-height:1.5}
#controls{position:absolute;bottom:0;width:100%;display:flex;justify-content:space-between;padding:20px;z-index:10}
.btn{width:80px;height:80px;border-radius:50%;background:rgba(255,255,255,.15);border:2px solid #fff;color:#fff;display:flex;align-items:center;justify-content:center;font-weight:bold;backdrop-filter:blur(5px)}
.btn:active{background:rgba(255,255,0,.6)}
#nitro{border-color:#0ff}
#steer{position:absolute;bottom:120px;width:100%;display:flex;justify-content:space-between;padding:0 40px}
.s-btn{width:70px;height:70px;border-radius:15px;background:rgba(255,255,255,.1);border:1px solid #fff;color:#fff;font-size:24px}
</style>
</head>
<body>
<div id="game">
<div id="hud">SCORE: <span id="score">0</span><br>LAP: <span id="lap">1/3</span><br><span id="speed">0 KM/H</span></div>
<canvas id="c"></canvas>
<div id="steer"><button class="s-btn" id="left">◀</button><button class="s-btn" id="right">▶</button></div>
<div id="controls"><div class="btn" id="brake">BRAKE</div><div class="btn" id="nitro">NITRO</div></div>
</div>
<script>
const canvas=document.getElementById('c'), ctx=canvas.getContext('2d');
function resize(){canvas.width=innerWidth;canvas.height=innerHeight} resize(); window.onresize=resize;

let keys={}, car={x:innerWidth/2,y:innerHeight*0.85,angle:-Math.PI/2,speed:0,max:6,drift:0}, lap=1, score=0, nitro=100;

const left=document.getElementById('left'), right=document.getElementById('right'), brake=document.getElementById('brake'), nitroBtn=document.getElementById('nitro');

left.ontouchstart=()=>keys.l=true; left.ontouchend=()=>keys.l=false;
right.ontouchstart=()=>keys.r=true; right.ontouchend=()=>keys.r=false;
brake.ontouchstart=()=>keys.b=true; brake.ontouchend=()=>keys.b=false;
nitroBtn.ontouchstart=()=>keys.n=true; nitroBtn.ontouchend=()=>keys.n=false;

window.onkeydown=e=>{if(e.key=='a'||e.key=='ArrowLeft')keys.l=true; if(e.key=='d'||e.key=='ArrowRight')keys.r=true; if(e.key==' ')keys.b=true; if(e.key=='Shift')keys.n=true}
window.onkeyup=e=>{if(e.key=='a'||e.key=='ArrowLeft')keys.l=false; if(e.key=='d'||e.key=='ArrowRight')keys.r=false; if(e.key==' ')keys.b=false; if(e.key=='Shift')keys.n=false}

function update(){
  let acc = 0.15;
  if(keys.n && nitro>0){acc=0.35; nitro-=0.8; car.max=9}else{car.max=6; if(nitro<100)nitro+=0.2}
  if(keys.b){car.speed*=0.95}else{car.speed+=acc; if(car.speed>car.max)car.speed=car.max}
  if(!keys.b && !keys.n)car.speed*=0.99;
  
  if(keys.l)car.angle-=0.06 * (car.speed/3);
  if(keys.r)car.angle+=0.06 * (car.speed/3);
  
  car.x+=Math.cos(car.angle)*car.speed;
  car.y+=Math.sin(car.angle)*car.speed;
  
  // batas map
  if(car.x<0)car.x=0; if(car.x>innerWidth)car.x=innerWidth;
  if(car.y<0)car.y=0; if(car.y>innerHeight)car.y=innerHeight;
  
  score+=Math.floor(car.speed);
  document.getElementById('score').innerText=score;
  document.getElementById('speed').innerText=Math.floor(car.speed*35)+' KM/H';
  document.getElementById('lap').innerText=lap+'/3';
  nitroBtn.innerHTML='NITRO<br>'+Math.floor(nitro)+'%';
  nitroBtn.style.opacity=0.3+nitro/100;
  
  // simple lap system - lewat bawah
  if(car.y>innerHeight*0.8 && car.y<innerHeight*0.9 && Math.abs(car.x-innerWidth/2)<100){
    // crossing start line
  }
}

function draw(){
  ctx.clearRect(0,0,canvas.width,canvas.height);
  // mobil player
  ctx.save();
  ctx.translate(car.x,car.y);
  ctx.rotate(car.angle);
  ctx.fillStyle='#2b8cff'; ctx.shadowColor='#2b8cff'; ctx.shadowBlur=15;
  ctx.fillRect(-18,-10,36,20);
  ctx.fillStyle='#fff'; ctx.fillRect(12,-6,6,12);
  // drift smoke
  if(keys.b && car.speed>2){
    ctx.fillStyle='rgba(255,255,255,0.4)';
    ctx.beginPath(); ctx.arc(-15,0,Math.random()*10,0,Math.PI*2); ctx.fill();
  }
  ctx.restore();
  
  // bot musuh dummy (merah hijau)
  const bots=[{x:innerWidth*0.6,y:innerHeight*0.7},{x:innerWidth*0.3,y:innerHeight*0.4}];
  bots.forEach(b=>{
    ctx.fillStyle='red'; ctx.fillRect(b.x,b.y,20,30);
  });
}

function loop(){update(); draw(); requestAnimationFrame(loop)} loop();
</script>
</body>
</html>
